name: EAS OTA Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'backend/**'
      - '.gitignore'

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ota-update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🏗 Checkout code
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript type check
        run: npx tsc --noEmit

      - name: 🏗 Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🚀 Publish OTA update
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | head -c 200)
          npx eas-cli update \
            --branch production \
            --message "${COMMIT_MSG}" \
            --non-interactive
